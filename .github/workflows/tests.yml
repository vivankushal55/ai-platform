name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pandas scikit-learn sentence-transformers faiss-cpu pytest
      - name: Run non-API tests
        run: pytest tests/ -v -m "not api"
